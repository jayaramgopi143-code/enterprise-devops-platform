name: Enterprise DevOps CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: enterprise-devops-app
  IMAGE_TAG: latest

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        docker build -t $ECR_REPOSITORY ./app

    - name: Tag Docker Image
      run: |
        docker tag $ECR_REPOSITORY:latest \
        433939225422.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:latest

    - name: Push Docker Image to ECR
      run: |
        docker push \
        433939225422.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |

          aws ecr get-login-password --region ap-south-1 | docker login \
          --username AWS \
          --password-stdin 433939225422.dkr.ecr.ap-south-1.amazonaws.com

          docker pull \
          433939225422.dkr.ecr.ap-south-1.amazonaws.com/enterprise-devops-app:latest

          docker stop enterprise-devops-app || true
          docker rm enterprise-devops-app || true

          docker run -d \
          --restart unless-stopped \
          -p 80:80 \
          --name enterprise-devops-app \
          433939225422.dkr.ecr.ap-south-1.amazonaws.com/enterprise-devops-app:latest
